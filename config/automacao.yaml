# Automação: o que roda sozinho, de quanto em quanto tempo e com quais limites.
# Segredos (tokens) ficam no .env, nunca aqui.

# ---------------------------------------------------------------- radar de notícias
radar:
  intervalo_min: 30            # o `paginas ciclo` só consulta as notícias a cada 30 min
  # Buscas no Google Notícias (RSS público). Em português e em inglês: a notícia de fora chega antes.
  consultas:
    - {q: "GTA 6", idioma: pt}
    - {q: "GTA VI Rockstar", idioma: en}
    - {q: "Grand Theft Auto VI", idioma: en}
    - {q: "The Game Awards 2026", idioma: en}
  # Feeds dos próprios sites (o link abre a matéria; o redator lê o texto). Só entra o que fala de GTA 6.
  feeds_diretos:
    - https://blog.playstation.com/feed/
    - https://news.xbox.com/en-us/feed/
    - https://www.videogameschronicle.com/feed/
    - https://www.eurogamer.net/feed
    - https://feeds.ign.com/ign/games-all
    - https://www.gamespot.com/feeds/news/
    - https://www.polygon.com/rss/index.xml
    - https://rss.tecmundo.com.br/feed
    - https://canaltech.com.br/rss/
    - https://www.theenemy.com.br/rss
    - https://www.gamesradar.com/feeds/all/
    - https://www.pushsquare.com/feeds/latest
    - https://www.pcgamer.com/rss/
  filtro_diretos: 'gta\s*(6|vi)\b|grand theft auto vi|rockstar games'
  # Domínio da fonte -> selo sugerido. O Claude confere antes de usar.
  fontes:
    confirmado: [rockstargames.com, take2games.com, blog.playstation.com, playstation.com, news.xbox.com,
                 xbox.com, thegameawards.com]
    relato: [bloomberg.com, ign.com, gamesbeat.com, venturebeat.com, kotaku.com, eurogamer.net, polygon.com,
             theverge.com, videogameschronicle.com, gamespot.com, tecnoblog.net, canaltech.com.br,
             tecmundo.com.br, omelete.com.br, theenemy.com.br, uol.com.br, g1.globo.com]
  # Alerta quente: fonte oficial, ou o mesmo assunto em várias fontes sérias em pouco tempo.
  alerta:
    fontes_diferentes: 3
    janela_horas: 3
    # Assunto muito relevante: uma fonte séria basta, e o post sai na hora (ignora os horários base).
    palavras_quentes: [trailer, adiad, delay, data de lançamento, release date, preço, price, edição, edition,
                       gameplay, pc, oficial, official, revela, reveals, anuncia, announces, vaz, leak]
  acionar_claude_no_alerta: true
  # Economia do plano do Claude (escolha do Vinicius em 10/11): o post na hora só sai quando a notícia
  # vem de fonte oficial; as outras notícias quentes chegam no Telegram e entram no radar seguinte.
  claude_so_com_fonte_oficial: true   # escreve o RADAR do assunto e manda a prévia para aprovação

# ---------------------------------------------------------------- biblioteca oficial (sem jogar)
# Pacotes da página de mídia oficial de GTA VI (rockstargames.com/VI/media): a Rockstar oferece
# "Download All" de trailers, clipes, screenshots e artes. O ciclo confere uma vez por dia.
biblioteca:
  verificar_a_cada_horas: 24
  pacotes:
    - nome: trailers_e_clipes
      url: https://media-rockstargames-com.akamaized.net/VI/downloads/videos/GTAVI_Videos.zip
    - nome: screenshots
      url: https://media-rockstargames-com.akamaized.net/VI/downloads/screenshots/GTAVI_Screenshots.zip
    - nome: artes_e_wallpapers
      url: https://media-rockstargames-com.akamaized.net/VI/downloads/artwork_wallpapers/GTAVI_Artwork_Wallpapers.zip
    - nome: ultimate_edition
      url: https://media-rockstargames-com.akamaized.net/VI/downloads/screenshots/GTAVI_Ultimate_Edition_Benefits.zip
    - nome: vintage_vice_city_pack
      url: https://media-rockstargames-com.akamaized.net/VI/downloads/screenshots/GTAVI_Vintage_Vice_City_Pack.zip
  # Vídeos de GTA VI servidos pelo player oficial da Rockstar (rockstargames.com/videos), não pelo YouTube.
  # Em 12/11/2026 só o "An Extended Look" estava lá; os trailers 1, 2 e de lançamento são do YouTube.
  videos:
    - nome: gta6_an_extended_look
      url: https://videos-rockstargames-com.akamaized.net/v4/rk721912/flv/en-us-1080p.mp4

# ---------------------------------------------------------------- sugestões de comentário
# 12h e 19h: o kit lê (API oficial) os posts recentes destas páginas e manda no Telegram um comentário
# pronto para cada post bombando. Quem comenta é o Vinicius, à mão (regra nº 1).
comentarios:
  paginas: [ignbrasil, meups, flowgamesbr, portalgtabr, fluidgame, seekkey, theenemybr, voxelbr]

# ---------------------------------------------------------------- quem escreve os posts
# gemini: grátis (GEMINI_API_KEY, plano gratuito do Google AI Studio); o kit pesquisa e confere, o Gemini
# só escreve. claude: o Claude Code (gasta o plano do Claude). Sem a chave do Gemini, volta para o Claude.
redator: claude      # gemini testado em 10/11: texto raso e assunto repetido; fica desligado até melhorar
gemini:
  modelo: auto       # o Flash mais novo liberado para a chave; ou um nome fixo, ex.: gemini-2.5-flash

# ---------------------------------------------------------------- formato dos posts
# Sem voz de IA configurada (ELEVENLABS_API_KEY + voice_id, ou AZURE_SPEECH_KEY), todo post sai como
# carrossel no modelo revista, que já gera o Reel do mesmo post (sem narração). Mude para false quando
# a voz estiver pronta e os Reels narrados voltam.
# ---------------------------------------------------------------- freio de publicação
# A API deixa 100 posts/24 h, mas conta e app novos em rajada parecem robô (bloqueio de 11/11/2026).
# Reel e carrossel contam separados. O excedente espera na fila; nada se perde. Suba aos poucos
# (ex.: 8 depois de um mês sem problema), nunca de uma vez.
publicacao:
  # Reels no Instagram: "api" (o kit publica) ou "manual" (o kit manda vídeo, capa e legenda no Telegram
  # na hora marcada e o Vinicius posta pelo app). Manual desde 13/11: a API recusa vídeo (erro 2207076).
  instagram_reels: manual
  # No modo manual, cada Reel tenta a API antes (desde 25/11; antes era só o 1º do dia): se passar,
  # saida/instagram_api.json fica com api_ok e o kit posta sozinho (avisa no Telegram); se a Meta recusar,
  # aquele Reel vai na hora para o Telegram.
  # Só Reels (14/11): nenhum carrossel no feed do Instagram até a página ter mais seguidores
  instagram_carrosseis_por_dia: 0
  # Teto de Reels por dia (18/11): notícia do radar tira post de pauta; o que passar do teto não é agendado
  reels_por_dia: 4
  # Redes que o kit não publica (18/11, pedido do Vinicius: foco só nos Reels do Instagram). A Página do
  # Facebook continua servindo de "hospedagem" invisível (rascunho) para entregar o vídeo no Telegram.
  desligar: [facebook]
  instagram: {max_24h: 6, minutos_entre_posts: 90}
  facebook: {max_24h: 4, minutos_entre_posts: 90}

conteudo:
  so_carrossel: auto      # auto: só carrossel enquanto não houver AZURE_SPEECH_KEY (ou ELEVENLABS_API_KEY)

# ---------------------------------------------------------------- página em espanhol
# Ligue depois de umas 3 semanas da página em português (Plano, seção Escala). Com `ativa: true`, a
# tarefa `paginas claude traducao` (todo dia às 08:10) adapta as pautas novas para a GG Explica ES.
traducao:
  ativa: false

# ---------------------------------------------------------------- material salvo à mão
# Prints de trailer, imagens de divulgação (Xbox, PlayStation) e trechos gravados da tela vão para
# clipes/entrada; o ciclo organiza e cataloga.
clipes:
  pasta_entrada: clipes/entrada
  segundos_parado: 45              # arquivo sem mudar há 45 s = gravação terminada
  etiquetar_com_claude: true       # o Claude olha a folha de contato e preenche o catálogo

# ---------------------------------------------------------------- Claude Code (claude -p)
claude:
  comando: claude
  # Ferramentas liberadas nas tarefas automáticas: ler e editar o kit, pesquisar na web e rodar
  # só os comandos do próprio kit. Nada de apagar arquivo ou rodar programa qualquer.
  # No Windows sem Git Bash o Claude Code usa a ferramenta PowerShell; por isso as duas formas.
  ferramentas: "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(paginas validar *),Bash(paginas catalogar *),Bash(paginas fila),PowerShell(paginas validar *),PowerShell(paginas catalogar *),PowerShell(paginas fila)"
  modo_permissao: acceptEdits
  sem_perguntas: true              # --permission-prompts none (Claude Code 2.1.259 ou mais novo)
  limite_minutos: 45

# ---------------------------------------------------------------- aprovação pelo Telegram
telegram:
  # automatica: o kit agenda sozinho cada rascunho sem bloqueio e só avisa (✍️ Ajustar / 🗑 Cancelar até
  # sair, e o link quando sai). manual: cada post espera o ✅ no Telegram.
  aprovacao: automatica
  # O ciclo manda a prévia de cada rascunho de hoje e de amanhã assim que ele fica pronto. A prévia já
  # sai com a voz de verdade, que fica em cache: aprovar não gasta crédito de voz de novo.
  enviar_dias_a_frente: 1
