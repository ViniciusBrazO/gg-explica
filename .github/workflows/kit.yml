# GG Explica na nuvem: tudo roda aqui, sem computador ligado.
#   ciclo     a cada 30 min, 08h00-00h30 de Brasília: radar, botões do Telegram, prévias, publicação
#   radar     07h10 e 17h10: o Claude escreve 2 a 3 posts para os horários livres (rascunhos;
#             as prévias chegam no Telegram). Notícia quente vira post na hora (alerta).
#   pauta     segunda 07h40: o Claude monta a pauta da semana
#   metricas  23h30 todo dia: números do Instagram e o resumo do dia no Telegram (Reels + músicas em alta)
# Segredos (Settings > Secrets and variables > Actions): META_TOKEN_GG_EXPLICA, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID e CLAUDE_CODE_OAUTH_TOKEN (gerado com `claude setup-token`).
name: kit

on:
  # Sem "schedule": o agendador do GitHub atrasava ou pulava rodadas. Quem dispara é o cron-job.org
  # (tarefa=auto, de hora em hora em :07, 07h07-23h07 de Brasília; veja "Qual tarefa"). De hora em hora
  # desde 12/11: o repositório é privado e o plano grátis do GitHub dá 2.000 minutos por mês.
  workflow_dispatch:
    inputs:
      vozes:
        description: "teste-voz: vozes da Azure para comparar (vírgula)"
        default: ""
        required: false
      tarefa:
        description: "auto | ciclo | radar | comentarios | pauta | catalogo | metricas | resumo | teste-voz | biblioteca | telegram-teste | simular | dossie"
        default: ciclo
        required: true

concurrency:
  group: gg-explica          # uma rodada por vez: o estado volta para o repositório no fim
  cancel-in-progress: false

permissions:
  contents: write
  actions: write            # rodada leve que acha notícia quente chama uma rodada pesada na hora

env:
  TZ: America/Sao_Paulo
  PYTHONUTF8: "1"
  FB_PAGE_ID_GG_EXPLICA: "1368551089682268"
  META_TOKEN_GG_EXPLICA: ${{ secrets.META_TOKEN_GG_EXPLICA }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PYTHONUNBUFFERED: "1"   # o log mostra cada passo na hora (sem isso, uma rodada travada some sem rastro)
  # Gameplay do Vinicius (pasta "GG Gameplay" do Google Drive) e YouTube: mesmo cliente OAuth do Google
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN_GG_EXPLICA: ${{ secrets.YT_REFRESH_TOKEN_GG_EXPLICA }}
  GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
  AZURE_SPEECH_REGION: brazilsouth

jobs:
  kit:
    runs-on: ubuntu-24.04      # versão fixa: a 'latest' nova teve espelhos do apt fora do ar
    timeout-minutes: 120  # repositório público: minuto não custa; a rodada do radar (Claude + 4 Reels) passa de 55 min
    steps:
      - name: Qual tarefa
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "10 10 * * *"|"10 20 * * *") t=radar ;;
            "40 10 * * 1") t=pauta ;;
            "30 2 * * *") t=metricas ;;
            "5 15 * * *"|"5 22 * * *") t=comentarios ;;
            "") t="${{ github.event.inputs.tarefa || 'ciclo' }}" ;;
            *) t=ciclo ;;
          esac
          if [ "$t" = "auto" ]; then
            # disparo externo (cron-job.org, de hora em hora em :07): a hora de Brasília decide a tarefa
            # (o horário do disparo pode atrasar alguns minutos; por isso olha só a hora)
            h=$(TZ=America/Sao_Paulo date +%H); dia=$(TZ=America/Sao_Paulo date +%u)
            case "$h" in
              07) t=radar ;;
              # pauta semanal desligada em 18/11: o radar já faz os 4 Reels do dia (6 por dia passava do freio)
              12|19) t=comentarios-ciclo ;;
              17) t=radar ;;
              23) t=metricas ;;
              *) t=ciclo ;;
            esac
          fi
          echo "tarefa=$t" >> "$GITHUB_OUTPUT"
          echo "tarefa: $t"

      - uses: actions/checkout@v4
        with:
          ref: main      # sempre o estado mais novo (a rodada que esperou na fila não pode usar o estado velho)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Kit
        run: pip install -e ".[azure]" --quiet   # a voz Antonio (Azure) precisa do SDK em toda rodada

      - name: Slides e vídeos já prontos (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            saida/carrosseis
            saida/videos
            saida/cache
            saida/cache_voz
          key: midia-${{ github.run_id }}
          restore-keys: midia-

      - name: Leve ou pesada
        id: plano
        run: |
          t="${{ steps.t.outputs.tarefa }}"
          if [ "$t" = "ciclo" ] || [ "$t" = "comentarios-ciclo" ]; then paginas nuvem plano; else echo "pesado=$([ "$t" = telegram-teste ] || [ "$t" = gemini ] || [ "$t" = comentarios ] || [ "$t" = simular ] || [ "$t" = dossie ] && echo false || echo true)" >> "$GITHUB_OUTPUT"; fi

      # ---------------------------------------------------------------- só nas rodadas pesadas
      - name: Biblioteca oficial (cache)
        if: steps.plano.outputs.pesado == 'true'
        id: clipes
        uses: actions/cache/restore@v4
        with:
          path: |
            clipes/oficial
            clipes/_folhas
          key: clipes2-${{ hashFiles('saida/biblioteca.json') }}
          restore-keys: |
            clipes2-
            clipes-

      - name: ffmpeg, fontes e navegador
        if: steps.plano.outputs.pesado == 'true'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt com tempo limite; se os espelhos do Ubuntu falharem, usa o ffmpeg estático do pip
          if ! timeout 300 sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 install -y -qq --no-install-recommends ffmpeg fonts-noto-color-emoji >/dev/null 2>&1; then
            echo "apt indisponível: usando ffmpeg estático"
            pip install --quiet imageio-ffmpeg
            mkdir -p "$HOME/bin"
            ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          pip install --quiet faster-whisper || echo "faster-whisper não instalou: legenda com tempo estimado"   # tempo de cada palavra da voz do Gemini
          timeout 400 python -m playwright install --with-deps chromium >/dev/null 2>&1 || python -m playwright install chromium >/dev/null

      - name: Claude Code
        if: steps.plano.outputs.pesado == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          curl -fsSL https://claude.ai/install.sh | bash >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------- a tarefa
      - name: Voz ligada?
        run: |
          mkdir -p saida
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$AZURE_SPEECH_KEY" ] || [ -n "$ELEVENLABS_API_KEY" ]; then echo ligada; else echo desligada; fi > saida/estado_voz.txt
          echo "voz: $(cat saida/estado_voz.txt)"

      - name: Rodar
        env:
          RODADA: ${{ steps.plano.outputs.pesado == 'true' && 'pesada' || 'leve' }}
        run: |
          case "${{ steps.t.outputs.tarefa }}" in
            ciclo) paginas ciclo ;;
            radar) paginas radar || true; paginas claude radar || true; paginas ciclo ;;
            pauta) paginas claude pauta || true; paginas ciclo ;;
            catalogo) paginas catalogar && paginas claude catalogo ;;
            teste-voz) paginas teste-voz --vozes "${{ github.event.inputs.vozes }}" ;;
            metricas) paginas metricas; paginas resumo ;;
            resumo) paginas resumo ;;
            gemini) paginas gemini ;;
            comentarios) paginas comentarios ;;
            comentarios-ciclo) paginas comentarios || true; paginas ciclo ;;
            biblioteca) paginas biblioteca ;;
            dossie) paginas radar || true; paginas dossie ;;
            ver-trailers) python scripts/ver_trailers.py ;;
            testar-cdn) python scripts/testar_cdn.py ;;
            vozes-naturais) python scripts/amostras_voz.py ;;
            reel-voz) python scripts/reel_teste_voz.py ;;
            diag-voz) python scripts/diag_voz.py ;;
            refazer-voz*) t="${{ steps.t.outputs.tarefa }}"; python scripts/refazer_voz.py "${t#refazer-voz:}" ;;
            nova-capa*) t="${{ steps.t.outputs.tarefa }}"; paginas nova-capa "${t#nova-capa:}" --busca "${{ github.event.inputs.vozes }}" ;;
            diag-reel) for v in saida/videos/gg_explica/2026-11-12_radar_2026-11-12_clipe_miami_reel.mp4 saida/videos/gg_explica/2026-11-11_radar_2026-11-11_preco_reais_reel.mp4; do echo "== $v"; paginas diagnostico-reel "$v"; done ;;
            telegram-teste) paginas telegram teste ;;
            simular) paginas meta conferir --marca gg_explica && paginas publicar --simular ;;
            amostra) for v in $(ls -t saida/videos/gg_explica/*.mp4 | head -12); do echo "== $v $(stat -c %s "$v") bytes $(date -r "$v" +%d/%m_%H:%M)"; ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_name,profile,level,width,height,r_frame_rate,avg_frame_rate,pix_fmt,sample_rate,channels,bit_rate,nb_frames -of compact "$v"; python -c "import sys;d=open(sys.argv[1],'rb').read();print('elst',d.count(b'elst'),'moov<mdat',d.find(b'moov')<d.find(b'mdat'))" "$v"; done ;;
          esac

      - name: Amostras de voz (artefato)
        if: always() && steps.t.outputs.tarefa == 'vozes-naturais'
        uses: actions/upload-artifact@v4
        with:
          name: amostras-voz
          path: saida/amostras_voz/*.mp3
          retention-days: 7

      - name: Amostras de voz (ramo amostras-voz, para ouvir pelo Claude)
        if: always() && (steps.t.outputs.tarefa == 'vozes-naturais' || steps.t.outputs.tarefa == 'reel-voz' || steps.t.outputs.tarefa == 'diag-voz')
        run: |
          mkdir -p /tmp/am; cp saida/amostras_voz/*.mp* /tmp/am/ 2>/dev/null; cp saida/amostras_voz/diag*.wav /tmp/am/ 2>/dev/null; ls /tmp/am/* >/dev/null 2>&1 || exit 0
          cd /tmp/am && git init -q -b amostras-voz && git add . && git -c user.name=gg-explica-bot -c user.email=actions@users.noreply.github.com commit -qm "amostras de voz"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras-voz

      - name: Rodada leve deixou trabalho (notícia quente, post novo)? Chama a rodada pesada agora
        if: always() && steps.plano.outputs.pesado != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_OUTPUT: /dev/null
        run: |
          if paginas nuvem plano | grep -q "rodada pesada"; then
            gh workflow run kit.yml -f tarefa=ciclo && echo "rodada pesada chamada"
          fi

      # ---------------------------------------------------------------- guardar
      - name: Guardar o estado no repositório
        if: always()
        run: |
          git config user.name "gg-explica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A pautas saida clipes/catalogo.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "estado: ${{ steps.t.outputs.tarefa }} $(date +'%d/%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1

      - name: Apagar slides e vídeos com mais de 10 dias
        if: always() && steps.plano.outputs.pesado == 'true'
        run: find saida/carrosseis saida/videos -type f -mtime +10 -delete 2>/dev/null || true

      - name: Guardar slides e vídeos (cache)
        if: always() && steps.plano.outputs.pesado == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            saida/carrosseis
            saida/videos
            saida/cache
            saida/cache_voz
          key: midia-${{ github.run_id }}

      - name: Guardar a biblioteca (cache)
        if: always() && steps.plano.outputs.pesado == 'true'
        continue-on-error: true      # a chave já existe = nada mudou na biblioteca
        uses: actions/cache/save@v4
        with:
          path: |
            clipes/oficial
            clipes/_folhas
          key: clipes2-${{ hashFiles('saida/biblioteca.json') }}
