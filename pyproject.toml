[project]
name = "paginas-nicho"
version = "0.1.0"
description = "Pipeline de vídeos curtos sem rosto para GG Explica e Seul no Bolso"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6",
  "Jinja2>=3.1",
  "requests>=2.31",
  "playwright>=1.44",
  "Pillow>=10",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",            # fuso de Brasília no Windows (que não traz a base de fusos)
]

[project.optional-dependencies]
azure = ["azure-cognitiveservices-speech>=1.38"]
gemini = ["faster-whisper>=1.0"]   # tempo de cada palavra da voz do Gemini (legenda karaokê)
dev = ["pytest>=8"]

[project.scripts]
paginas = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["lento: renderiza vídeo de verdade (leva cerca de 1 minuto)"]
